name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    name: Verify reviewed release
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install verification dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify tag, changelog, and protected-main ancestry
        run: >-
          python scripts/check_release.py
          --tag "${GITHUB_REF_NAME}"
          --commit "$(git rev-parse HEAD)"
          --main-ref origin/main
      - name: Run release gates
        run: |
          pytest
          ruff check .
          python scripts/validate_agent_team.py

  build:
    name: Build with hash-locked toolchain
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag with full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/release.txt
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r requirements/release.txt
      - name: Reverify release ancestry
        run: >-
          python scripts/check_release.py
          --tag "${GITHUB_REF_NAME}"
          --commit "$(git rev-parse HEAD)"
          --main-ref origin/main
      - name: Build wheel and source distribution without isolated dependency resolution
        run: python -m build --no-isolation
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-test installed wheel
        run: |
          python -m venv /tmp/ai-gateway-smoke
          /tmp/ai-gateway-smoke/bin/pip install dist/*.whl
          /tmp/ai-gateway-smoke/bin/ai-gateway --decision-only "Explain gravity" > /dev/null
          /tmp/ai-gateway-smoke/bin/ai-gateway-team roles --json > /dev/null
      - name: Upload distribution artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish with trusted identity
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ai-routing-gateway
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
